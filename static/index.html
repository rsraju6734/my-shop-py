<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Shop</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 20px auto; padding: 0 10px; }
    #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
    .card { border: 1px solid #ddd; border-radius: 8px; overflow: hidden; background: #fff; }
    .card img, .card .noimg { width: 100%; height: 180px; object-fit: cover; display: block; }
    .noimg { background: #eee; display: flex; align-items: center; justify-content: center; color: #888; }
    .info { padding: 10px; }
    .info b { display: block; margin-bottom: 4px; }
    .out { color: #c00; }
  </style>
</head>
<body>
  <h1>My Shop</h1>
  <div id="list"></div>

  <script>
    function esc(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    fetch("/api/products")
      .then(r => r.json())
      .then(products => {
        const list = document.getElementById("list");
        if (products.length === 0) {
          list.innerHTML = "<p>Ekhono kono product nei.</p>";
          return;
        }
        list.innerHTML = products.map(p => `
          <div class="card">
            ${p.image ? `<img src="${esc(p.image)}" alt="${esc(p.name)}">` : `<div class="noimg">Pic nei</div>`}
            <div class="info">
              <b>${esc(p.name)}</b>
              <div>${p.price} Taka</div>
              <div class="${p.stock > 0 ? "" : "out"}">${p.stock > 0 ? "Stock: " + p.stock : "Stock sesh"}</div>
            </div>
          </div>
        `).join("");
      });
  </script>
</body>
</html>
